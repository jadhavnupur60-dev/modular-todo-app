
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple modular to-do list application.">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <p class="eyebrow">STAY ORGANIZED</p>
            <h1>My To-Do List</h1>
            <p class="subtitle">Small steps make big progress.</p>
        </header>

        <form id="task-form">
            <label for="task-input">Add a new task</label>
            <div class="input-row">
                <input
                    id="task-input"
                    type="text"
                    placeholder="What do you need to do?"
                    maxlength="200"
                    required
                >
                <button type="submit" class="add-button">Add Task</button>
            </div>
        </form>

        <section class="task-section" aria-labelledby="tasks-heading">
            <div class="task-heading">
                <h2 id="tasks-heading">Your Tasks</h2>
                <span id="task-count">0 tasks</span>
            </div>

            <p id="empty-message">No tasks yet. Add your first task!</p>
            <ul id="task-list" aria-label="To-do tasks"></ul>
        </section>

        <footer>
            <p>Your tasks are saved in this browser.</p>
        </footer>
    </main>
</body>
</html>
